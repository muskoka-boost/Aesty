plugins {
    id 'com.android.application'
}

android {
    namespace 'design.aesty.tvlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'design.aesty.tvlauncher'
        minSdk 24          // Android TV 7.0+ — covers every Bravia from 2016 on
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away via adb.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
