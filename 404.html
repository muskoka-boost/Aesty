<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Aesty Design</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Karla:wght@300&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F5F1; color: #1A1917;
    font-family: 'Karla', system-ui, sans-serif; font-weight: 300; text-align: center; padding: 24px; box-sizing: border-box; }
  p { margin: 0 0 12px; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: #8A6D2E; }
  h1 { margin: 0 0 28px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(40px, 6vw, 72px); line-height: 1; }
  a { color: #1A1917; text-decoration: none; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid #1A1917; padding-bottom: 4px; }
</style>
</head>
<body>
<main>
  <p>Not found</p>
  <h1>That page has wandered off.</h1>
  <a id="home" href="/#shop">Back to the shop</a>
</main>
<script>
  // On GitHub Pages the site lives under /<repo>/, so point the link there.
  if (location.hostname.endsWith('github.io')) {
    document.getElementById('home').href = '/' + location.pathname.split('/')[1] + '/#shop';
  }
</script>
</body>
</html>
